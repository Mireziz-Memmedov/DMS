<!DOCTYPE html>

<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DMS | Yazışma</title>
    <link rel="icon" href="Assets/DMS.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="api.js" defer></script>
    <script src="translation.js" defer></script>
    <script src="dark-mode.js" defer></script>
    <script src="chat.js" defer></script>
    <script src="call.js" defer></script>

</head>

<body>

    <main class="chat-page">

        <!-- =========================
             CHAT HEADER
        ========================== -->

        <header class="chat-header">

            <div class="chat-header-left">

                <button class="back-button" id="backButton" type="button" aria-label="Geri">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>


                <div class="chat-user-avatar">

                    <span id="chatUserAvatar">
                        U
                    </span>

                    <span id="chatUserOnlineDot" class="online-dot"></span>

                </div>


                <div class="chat-user-info">

                    <h1 id="chatUserName">
                        İstifadəçi
                    </h1>

                    <span id="chatUserStatus">
                        —
                    </span>

                </div>

            </div>


            <div class="chat-header-actions">

                <!-- Audio Call -->
                <button class="chat-icon-button" id="audioCallButton" type="button" aria-label="Səsli zəng"
                    title="Səsli zəng">
                    <i class="fa-solid fa-phone"></i>
                </button>

                <!-- Search -->
                <button class="chat-icon-button" id="chatSearchButton" type="button" aria-label="Axtar" title="Axtar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

                <!-- More -->
                <button class="chat-icon-button" id="chatMoreButton" type="button" aria-label="Daha çox"
                    title="Daha çox">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>

            </div>


        </header>


        <!-- =========================
             CHAT SEARCH
        ========================== -->

        <div class="chat-search-box" id="chatSearchBox">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text" id="messageSearch" placeholder="Mesajlarda axtar..." autocomplete="off">

            <button id="closeChatSearch" type="button" aria-label="Axtarışı bağla">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <!-- =========================
             MESSAGES
        ========================== -->

        <section class="messages-area" id="messagesArea">
        </section>

        <button id="newMessageButton" class="new-message-button" type="button" aria-label="Yeni mesajlara keç">

            <i class="fa-solid fa-arrow-down"></i>

            <span>Yeni mesaj</span>

        </button>


        <!-- =========================
             MESSAGE INPUT
        ========================== -->

        <footer class="message-input-area">

            <div class="message-input-wrapper">


                <!-- Attachment -->

                <button class="input-action" id="attachmentButton" type="button" aria-label="Fayl əlavə et">
                    <i class="fa-solid fa-paperclip"></i>
                </button>


                <!-- Input -->

                <textarea id="messageInput" rows="1" placeholder="Mesaj yaz..." autocomplete="off"></textarea>


                <!-- Emoji -->

                <button class="input-action" id="emojiButton" type="button" aria-label="Emoji">
                    <i class="fa-regular fa-face-smile"></i>
                </button>


                <div class="emoji-menu" id="emojiMenu">

                    <button type="button" class="emoji-item">
                        😀
                    </button>

                    <button type="button" class="emoji-item">
                        😂
                    </button>

                    <button type="button" class="emoji-item">
                        🤣
                    </button>

                    <button type="button" class="emoji-item">
                        😊
                    </button>

                    <button type="button" class="emoji-item">
                        😍
                    </button>

                    <button type="button" class="emoji-item">
                        🥰
                    </button>

                    <button type="button" class="emoji-item">
                        😘
                    </button>

                    <button type="button" class="emoji-item">
                        😎
                    </button>

                    <button type="button" class="emoji-item">
                        😢
                    </button>

                    <button type="button" class="emoji-item">
                        😭
                    </button>

                    <button type="button" class="emoji-item">
                        😡
                    </button>

                    <button type="button" class="emoji-item">
                        😱
                    </button>

                    <button type="button" class="emoji-item">
                        👍
                    </button>

                    <button type="button" class="emoji-item">
                        👎
                    </button>

                    <button type="button" class="emoji-item">
                        👏
                    </button>

                    <button type="button" class="emoji-item">
                        🙏
                    </button>

                    <button type="button" class="emoji-item">
                        ❤️
                    </button>

                    <button type="button" class="emoji-item">
                        🔥
                    </button>

                    <button type="button" class="emoji-item">
                        🎉
                    </button>

                    <button type="button" class="emoji-item">
                        ✅
                    </button>

                </div>


                <!-- Send -->

                <button class="send-button" id="sendButton" type="button" aria-label="Göndər">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

            </div>

        </footer>


        <!-- =========================
             CHAT MORE MENU
        ========================== -->

        <div class="chat-more-menu" id="chatMoreMenu">

            <button type="button" id="muteChatButton">

                <i class="fa-regular fa-bell-slash"></i>

                <span>
                    Bildirişləri susdur
                </span>

            </button>


            <button type="button" id="clearChatButton">

                <i class="fa-regular fa-trash-can"></i>

                <span>
                    Söhbəti təmizlə
                </span>

            </button>


            <button type="button" id="blockUserButton">

                <i class="fa-solid fa-ban"></i>

                <span>
                    Əməkdaşı blokla
                </span>

            </button>

        </div>


        <!-- =========================
             ATTACHMENT MENU
        ========================== -->

        <div class="attachment-menu" id="attachmentMenu">

            <button type="button" id="photoButton">

                <i class="fa-regular fa-image"></i>

                <span>
                    Şəkil
                </span>

            </button>


            <button type="button" id="fileButton">

                <i class="fa-regular fa-file"></i>

                <span>
                    Fayl
                </span>

            </button>

        </div>


        <!-- =========================
             HIDDEN FILE INPUT
        ========================== -->

        <input type="file" id="fileInput" hidden>

        <!-- =========================
     AUDIO CALL MODAL
========================== -->

        <section class="call-modal" id="callModal" role="dialog" aria-modal="true" aria-labelledby="callUserName"
            aria-hidden="true" hidden>

            <div class="call-window">

                <!-- Close -->
                <button class="call-close-button" id="closeCallModal" type="button" aria-label="Pəncərəni bağla">
                    <i class="fa-solid fa-xmark"></i>
                </button>


                <!-- User Avatar -->
                <div class="call-user-avatar" id="callUserAvatar">
                    <span>U</span>
                </div>


                <!-- User Info -->
                <div class="call-user-info">

                    <h2 id="callUserName">
                        İstifadəçi
                    </h2>

                    <p id="callStatus" aria-live="polite">
                        Zəngə hazırdır
                    </p>

                    <span id="callDuration">
                        00:00
                    </span>

                </div>


                <!-- Incoming Call Actions -->
                <div class="call-incoming-actions" id="callIncomingActions" hidden>

                    <button class="call-action-button call-reject-button" id="rejectCallButton" type="button"
                        aria-label="Zəngi rədd et">
                        <i class="fa-solid fa-phone-slash"></i>
                    </button>

                    <button class="call-action-button call-accept-button" id="acceptCallButton" type="button"
                        aria-label="Zəngi qəbul et">
                        <i class="fa-solid fa-phone"></i>
                    </button>

                </div>


                <!-- Active Call Actions -->
                <div class="call-active-actions" id="callActiveActions" hidden>

                    <!-- Microphone -->
                    <button class="call-action-button" id="toggleMuteButton" type="button" aria-label="Mikrofonu söndür"
                        aria-pressed="false">
                        <i class="fa-solid fa-microphone"></i>
                    </button>


                    <!-- Speaker -->
                    <button class="call-action-button" id="toggleSpeakerButton" type="button"
                        aria-label="Səs çıxışını dəyiş" aria-pressed="false">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>


                    <!-- End Call -->
                    <button class="call-action-button call-reject-button" id="endCallButton" type="button"
                        aria-label="Zəngi bitir">
                        <i class="fa-solid fa-phone-slash"></i>
                    </button>

                </div>

            </div>

        </section>


    </main>

</body>

</html>
