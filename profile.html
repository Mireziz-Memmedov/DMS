<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DMS | Profil</title>
    <link rel="icon" href="Assets/DMS.png">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/51d2f8b0de.js" crossorigin="anonymous"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" defer></script>

    <!-- JS -->
    <script src="translation.js" defer></script>
    <script src="dark-mode.js" defer></script>
    <script src="profile.js" defer></script>
</head>

<body>

    <main class="profile-page">

        <!-- TOP BAR -->
        <header class="top-bar">

            <div class="brand">

                <div class="brand-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>

                <div class="brand-name">
                    <span>DMS</span>
                    <small>Digital Messaging System</small>
                </div>

            </div>

            <div class="top-actions">

                <!-- Back button -->
                <button class="icon-button" type="button" onclick="history.back()">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

                <!-- Language -->
                <button class="icon-button" id="languageButton" type="button">
                    <i class="fa-solid fa-globe"></i>
                    <span id="currentLanguage">AZ</span>
                </button>

                <!-- Dark Mode -->
                <button class="icon-button" id="darkModeButton" type="button" aria-label="Dark mode">
                    <i class="fa-solid fa-moon"></i>
                </button>

            </div>

        </header>


        <!-- PROFILE CONTENT -->
        <section class="profile-container">

            <!-- PROFILE CARD -->
            <div class="profile-card">

                <div class="profile-avatar">

                    <div class="avatar-circle">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <button class="avatar-edit" type="button" id="avatarEdit" aria-label="Profil şəklini dəyiş">
                        <i class="fa-solid fa-camera"></i>
                    </button>

                </div>


                <div class="profile-name">
                    <h2 id="profileUsername">
                        İstifadəçi
                    </h2>

                    <p data-i18n="profile.status">
                        DMS istifadəçisi
                    </p>
                </div>

            </div>


            <!-- ACCOUNT INFORMATION -->
            <div class="profile-section">

                <div class="section-title">
                    <i class="fa-solid fa-user-circle"></i>

                    <span data-i18n="profile.account">
                        Hesab məlumatları
                    </span>
                </div>


                <div class="profile-item">

                    <div class="item-icon">
                        <i class="fa-regular fa-user"></i>
                    </div>

                    <div class="item-content">

                        <span class="item-label" data-i18n="profile.username">
                            İstifadəçi adı
                        </span>

                        <span class="item-value" id="usernameValue">
                            istifadəçi
                        </span>

                    </div>

                </div>


                <div class="profile-item">

                    <div class="item-icon">
                        <i class="fa-regular fa-envelope"></i>
                    </div>

                    <div class="item-content">

                        <span class="item-label" data-i18n="profile.email">
                            E-poçt
                        </span>

                        <span class="item-value" id="emailValue">
                            —
                        </span>

                    </div>

                </div>


                <div class="profile-item">

                    <div class="item-icon">
                        <i class="fa-solid fa-calendar-days"></i>
                    </div>

                    <div class="item-content">

                        <span class="item-label" data-i18n="profile.joined">
                            Qeydiyyat tarixi
                        </span>

                        <span class="item-value" id="joinedValue">
                            —
                        </span>

                    </div>

                </div>

            </div>


            <!-- SETTINGS -->
            <div class="profile-section">

                <div class="section-title">

                    <i class="fa-solid fa-sliders"></i>

                    <span data-i18n="profile.settings">
                        Parametrlər
                    </span>

                </div>


                <button class="profile-action" type="button" id="notificationsButton">

                    <div class="action-icon">
                        <i class="fa-regular fa-bell"></i>
                    </div>

                    <div class="action-content">

                        <span data-i18n="profile.notifications">
                            Bildirişlər
                        </span>

                        <small data-i18n="profile.notificationsDescription">
                            Mesaj və sistem bildirişləri
                        </small>

                    </div>

                    <i class="fa-solid fa-chevron-right action-arrow"></i>

                </button>


                <button class="profile-action" type="button" id="privacyButton">

                    <div class="action-icon">
                        <i class="fa-solid fa-lock"></i>
                    </div>

                    <div class="action-content">

                        <span data-i18n="profile.privacy">
                            Məxfilik
                        </span>

                        <small data-i18n="profile.privacyDescription">
                            Hesab və məxfilik parametrləri
                        </small>

                    </div>

                    <i class="fa-solid fa-chevron-right action-arrow"></i>

                </button>


                <button class="profile-action" type="button" id="securityButton">

                    <div class="action-icon">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>

                    <div class="action-content">

                        <span data-i18n="profile.security">
                            Təhlükəsizlik
                        </span>

                        <small data-i18n="profile.securityDescription">
                            Hesab təhlükəsizliyi
                        </small>

                    </div>

                    <i class="fa-solid fa-chevron-right action-arrow"></i>

                </button>

            </div>


            <!-- LANGUAGE -->
            <div class="profile-section">

                <div class="section-title">

                    <i class="fa-solid fa-language"></i>

                    <span data-i18n="profile.language">
                        Dil
                    </span>

                </div>


                <button class="profile-action" type="button" id="profileLanguageButton">

                    <div class="action-icon">
                        <i class="fa-solid fa-globe"></i>
                    </div>

                    <div class="action-content">

                        <span data-i18n="profile.languageSelect">
                            Tətbiq dili
                        </span>

                        <small id="profileCurrentLanguage">
                            Azərbaycan
                        </small>

                    </div>

                    <i class="fa-solid fa-chevron-right action-arrow"></i>

                </button>

            </div>


            <!-- LOGOUT -->
            <button class="logout-button" type="button" id="logoutButton">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span data-i18n="profile.logout">
                    Hesabdan çıx
                </span>

            </button>


            <!-- APP VERSION -->
            <div class="app-info">

                <div class="app-logo">
                    <i class="fa-solid fa-comments"></i>
                </div>

                <strong>DMS</strong>

                <span>
                    Digital Messaging System
                </span>

                <small>
                    v1.0.0
                </small>

            </div>

        </section>


        <!-- FOOTER -->
        <footer class="profile-footer">

            <span>© 2026 DMS</span>

            <span class="footer-dot">•</span>

            <span data-i18n="profile.footer">
                Təhlükəsiz mesajlaşma sistemi
            </span>

        </footer>


        <!-- LANGUAGE MENU -->
        <div class="language-menu" id="languageMenu">

            <button type="button" data-language="az">
                🇦🇿 Azərbaycan
            </button>

            <button type="button" data-language="en">
                🇬🇧 English
            </button>

            <button type="button" data-language="ru">
                🇷🇺 Русский
            </button>

        </div>

    </main>

</body>

</html>
